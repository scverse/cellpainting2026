# Each workstream appears as a card on the homepage.
# Remove all entries to hide the section.
# 'lead' is a GitHub username — their avatar is shown automatically.
- title: "Analysing CellProfiler output with scverse"
  description: "Connecting typical CellProfiler workflows to the scverse ecosystem: working out which output settings carry the most downstream value, converting features and metadata into AnnData and SpatialData, and establishing which scverse tools are useful once the data is there."
  lead: "timtreis"

- title: "Optical pooled screens in scverse"
  description: "Bringing optical pooled screening into scverse, where a phenotypic imaging round is paired with several rounds of in-situ sequencing. Deciding how to represent sequencing cycles and their registration, what breaks at plate scale, and what the ecosystem offers once images, masks and the per-cell table live in one object."
  lead: "LucaMarconato"

- title: "Uncertainty quantification for Cell Painting"
  description: "Attaching defensible confidence estimates to predictions made from morphological profiles. Comparing Bayesian and conformal approaches on profiles stored in AnnData, testing whether their uncertainties survive compound- and site-level splits, and asking how an uncertainty should be exposed to downstream users."
  lead: "hanyangii"

- title: "Cross-modal integration of morphology and transcriptomics"
  description: "Aligning Cell Painting profiles from LINCS and EU-OPENSCREEN with matched single-cell transcriptomics, using drug response as a supervision signal. Asking whether the two modalities are complementary or redundant, and which gene programs are encoded in a morphological phenotype."
  lead: "Arkkienkeli"

- title: "AI-driven single-cell image phenotyping with scPortrait"
  description: "Extending the scverse single-cell image toolkit scPortrait towards generative modelling of cell morphology, interactive visualisation of image-based phenotypes, and agentic image-processing workflows."
  lead: "nik-as"
